name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.5"
      - name: test
        run: go test ./...
      - name: build all platforms
        env:
          CGO_ENABLED: "0"
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME}"
          COMMIT="$(git rev-parse --short HEAD)"
          LDFLAGS="-X github.com/rdegges/pkms/internal/cli.version=${VERSION} -X github.com/rdegges/pkms/internal/cli.commit=${COMMIT}"
          for platform in darwin/arm64 darwin/amd64 linux/arm64 linux/amd64; do
            GOOS="${platform%/*}" GOARCH="${platform#*/}" \
              go build -trimpath -ldflags "$LDFLAGS" \
              -o "dist/pkms-${platform%/*}-${platform#*/}" ./cmd/pkms
          done
          (cd dist && shasum -a 256 pkms-* > checksums.txt)
      - name: create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/pkms-* dist/checksums.txt \
            --title "pkms ${GITHUB_REF_NAME}" --generate-notes
