schema_version = 1
name = "para"
description = "PARA: Projects / Areas / Resources / Archive"

scaffold = ["Inbox", "Projects", "Areas", "Resources", "Archive"]
root_files = []

[ingest]
clip = "clip" # everything ingested lands in Inbox/ for later sorting

# The clip type is the only typed note in the generic profile (phase-2
# question-round decision 1); otherwise only profile-agnostic lint rules
# (frontmatter well-formedness, links, junk files, placeholders) apply.

[[types]]
name = "clip"
scope = ["Inbox/*.md"]
schema = "schemas/clip.schema.json"
folder = "Inbox"
filename = "{{tsname .created}} - {{.title}}"

[lint.frontmatter-present]
enabled = false # ingested clips always get frontmatter; nothing to enforce

[lint.no-junk-files]
enabled = true

[lint.template-placeholders-in-real-notes]
enabled = true

[lint.empty-note]
enabled = true

[lint.wikilink-resolves]
enabled = true

[lint.wikilink-ambiguous]
enabled = true

[lint.no-broken-embed]
enabled = true
